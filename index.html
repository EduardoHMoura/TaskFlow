<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flowly — Organizador Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.gsiLoaded && window.gsiLoaded()"></script>
<script src="https://apis.google.com/js/api.js" async defer onload="window.gapiLoaded && window.gapiLoaded()"></script>
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --accent:#6366F1; --accent-soft:#818CF8; --accent-tint:rgba(99,102,241,.12); --accent-glow:rgba(99,102,241,.30);

  --glass-bg:rgba(255,255,255,.58); --glass-bg-strong:rgba(255,255,255,.82);
  --glass-bg-subtle:rgba(255,255,255,.32); --glass-bg-ultra:rgba(255,255,255,.14);
  --glass-border:rgba(255,255,255,.90); --glass-border-subtle:rgba(180,190,230,.35);
  --glass-blur:blur(40px) saturate(200%) brightness(1.04);
  --glass-blur-sm:blur(22px) saturate(180%) brightness(1.02);
  --glass-shadow:0 2px 12px rgba(60,80,200,.07),0 1px 0 rgba(255,255,255,.95) inset;
  --glass-shadow-lg:0 12px 48px rgba(60,80,200,.12),0 2px 0 rgba(255,255,255,.98) inset,0 0 0 1px rgba(255,255,255,.6);
  --glass-shadow-card:0 1px 8px rgba(60,80,200,.06),0 0 0 1px rgba(255,255,255,.85) inset;

  --bg-scene:linear-gradient(150deg,#C7D9FF 0%,#D4C8FF 25%,#E8D5FF 48%,#FFD6E7 72%,#C8EEFF 100%);
  --bg-orb1:radial-gradient(ellipse 65% 55% at 18% 28%, rgba(99,102,241,.28),transparent);
  --bg-orb2:radial-gradient(ellipse 55% 65% at 82% 72%, rgba(139,92,246,.24),transparent);
  --bg-orb3:radial-gradient(ellipse 50% 45% at 58% 12%, rgba(255,107,107,.16),transparent);
  --bg-orb4:radial-gradient(ellipse 40% 40% at 35% 80%, rgba(56,189,248,.20),transparent);

  --bg-card:rgba(255,255,255,.58); --bg-hover:rgba(255,255,255,.80);
  --border:rgba(255,255,255,.90); --border-solid:rgba(180,190,230,.45);
  --text-primary:#0A0C1E; --text-secondary:#3D4165; --text-muted:#7C85AB;

  --prio-urgent:#FF3B30; --prio-high:#FF9500; --prio-normal:#6366F1; --prio-low:#34C759;

  --radius-card:20px; --radius-btn:12px; --radius-badge:8px; --radius-xl:28px; --radius-pill:999px;
  --safe-bottom:env(safe-area-inset-bottom,0px); --safe-top:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --accent-tint:rgba(129,140,248,.16); --accent-glow:rgba(129,140,248,.35);
  --glass-bg:rgba(14,15,35,.78); --glass-bg-strong:rgba(18,19,46,.94);
  --glass-bg-subtle:rgba(22,24,55,.58); --glass-bg-ultra:rgba(30,32,70,.32);
  --glass-border:rgba(255,255,255,.09); --glass-border-subtle:rgba(80,90,160,.20);
  --glass-blur:blur(40px) saturate(180%) brightness(1.12);
  --glass-blur-sm:blur(22px) saturate(160%) brightness(1.08);
  --glass-shadow:0 2px 12px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06) inset;
  --glass-shadow-lg:0 12px 48px rgba(0,0,0,.70),0 1px 0 rgba(255,255,255,.07) inset,0 0 0 1px rgba(255,255,255,.04);
  --glass-shadow-card:0 1px 8px rgba(0,0,0,.50),0 0 0 1px rgba(255,255,255,.05) inset;
  --bg-scene:linear-gradient(150deg,#04050F 0%,#080B22 20%,#0D0A2A 42%,#130826 65%,#0A0610 100%);
  --bg-orb1:radial-gradient(ellipse 65% 55% at 18% 28%, rgba(99,102,241,.22),transparent);
  --bg-orb2:radial-gradient(ellipse 55% 65% at 82% 72%, rgba(139,92,246,.20),transparent);
  --bg-orb3:radial-gradient(ellipse 45% 40% at 55% 12%, rgba(255,107,107,.10),transparent);
  --bg-orb4:radial-gradient(ellipse 40% 45% at 30% 85%, rgba(56,189,248,.12),transparent);
  --bg-card:rgba(20,22,45,.75); --bg-hover:rgba(32,36,68,.85);
  --border:rgba(255,255,255,.08); --border-solid:rgba(60,70,120,.50);
  --text-primary:#EEF0FF; --text-secondary:#9098C0; --text-muted:#555E85;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Inter',system-ui,sans-serif;color:var(--text-primary);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg-scene);transition:background .5s ease}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg-orb1),var(--bg-orb2),var(--bg-orb3),var(--bg-orb4);animation:orbFloat 22s ease-in-out infinite alternate;pointer-events:none}
@keyframes orbFloat{0%{transform:scale(1) translate(0,0)}33%{transform:scale(1.08) translate(-20px,15px)}66%{transform:scale(.95) translate(15px,-20px)}100%{transform:scale(1.05) translate(-10px,10px)}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-primary)}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:999px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.glass{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow-card)}
.hidden{display:none !important}

/* ============================================================
   2. AUTH SCREEN
   ============================================================ */
.auth-screen{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.auth-screen.active{display:flex}
.auth-card{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-xl);box-shadow:var(--glass-shadow-lg);width:100%;max-width:420px;overflow:hidden}
.auth-inner{padding:36px 32px}
.auth-logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;margin-bottom:6px;justify-content:center}
.auth-logo .mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-soft));display:grid;place-items:center;box-shadow:0 4px 20px -4px var(--accent-glow)}
.auth-tagline{text-align:center;color:var(--text-secondary);font-size:13px;margin-bottom:24px}
.auth-tabs{display:flex;background:rgba(0,0,0,.06);border-radius:12px;padding:3px;margin-bottom:20px}
[data-theme="dark"] .auth-tabs{background:rgba(255,255,255,.06)}
.auth-tabs button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:13px;color:var(--text-secondary);transition:all .2s}
.auth-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#fff}
.auth-form{display:none}.auth-form.active{display:block}
.auth-form h2{font-size:19px;font-weight:700;margin-bottom:4px}
.auth-form .sub{color:var(--text-secondary);margin-bottom:16px;font-size:13px}
.field{margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:5px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--glass-border);border-radius:12px;background:var(--glass-bg-subtle);outline:none}
.field input:focus{border-color:var(--accent)}
.field-hint{font-size:11px;color:var(--prio-urgent);margin-top:4px;min-height:14px}
.auth-btn{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#fff;font-weight:700;margin-top:4px}
.auth-sep{text-align:center;font-size:11px;color:var(--text-muted);margin:14px 0}
.google-btn{width:100%;padding:11px;border-radius:12px;background:var(--glass-bg-subtle);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.google-btn svg{width:18px;height:18px}
.auth-link{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--text-muted)}
.auth-foot{text-align:center;font-size:11px;color:var(--text-muted);padding:14px;border-top:1px solid var(--glass-border)}

/* ============================================================
   3. APP SHELL
   ============================================================ */
.app{display:none;grid-template-columns:250px 1fr;height:100vh}
.app.active{display:grid}
.sidebar{display:flex;flex-direction:column;padding:20px 14px;border-right:1px solid var(--glass-border-subtle);background:var(--glass-bg-subtle);backdrop-filter:var(--glass-blur-sm);overflow-y:auto}
.side-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 8px 18px}
.side-logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-soft));display:grid;place-items:center}
.side-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.side-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--text-secondary);text-align:left}
.side-nav button:hover{background:var(--bg-hover)}
.side-nav button.active{background:var(--accent-tint);color:var(--accent)}
.side-div{height:1px;background:var(--glass-border-subtle);margin:10px 4px}
.side-sec-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 12px 6px}
.proj-list{display:flex;flex-direction:column;gap:1px;max-height:220px;overflow-y:auto;margin-bottom:6px}
.proj-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;position:relative}
.proj-item:hover{background:var(--bg-hover)}
.proj-item.active{background:var(--accent-tint);font-weight:700}
.proj-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.proj-item .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-item .pcount{font-size:11px;color:var(--text-muted);font-weight:600}
.proj-item .pmenu{opacity:0;width:20px;height:20px;display:grid;place-items:center;border-radius:6px;flex-shrink:0}
.proj-item:hover .pmenu{opacity:1}
.proj-item .pmenu:hover{background:var(--glass-bg-strong)}
.btn-add-proj{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--accent)}
.btn-add-proj:hover{background:var(--accent-tint)}
.sidebar-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--glass-border-subtle)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.sidebar-foot .who{flex:1;overflow:hidden}
.sidebar-foot .who b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-foot .who span{font-size:11px;color:var(--text-muted)}

.shell{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.header{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--glass-border-subtle);background:var(--glass-bg-subtle);backdrop-filter:var(--glass-blur-sm);flex-shrink:0}
.search-box{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--glass-bg-subtle);border:1px solid var(--glass-border);border-radius:12px;padding:8px 12px}
.search-box input{background:none;border:none;outline:none;flex:1;font-size:13px}
.header-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-secondary)}
.icon-btn:hover{background:var(--bg-hover)}
.icon-btn svg{width:18px;height:18px}
.main{flex:1;overflow-y:auto;padding:26px;min-height:0}
.mobile-header{display:none}
.bottom-nav{display:none}
.fab{display:none}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.page-head .sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.btn-primary{padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-sec{padding:9px 14px;border-radius:12px;background:var(--glass-bg-subtle);border:1px solid var(--glass-border);font-weight:600;font-size:13px}

/* quick add */
.quick-add{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;margin-bottom:18px}
.quick-add input{flex:1;background:none;border:none;outline:none;font-size:14px}
.quick-add .hint{font-size:11px;color:var(--text-muted)}

/* ============================================================
   4. CARDS / DASHBOARD
   ============================================================ */
.card{border-radius:var(--radius-card);padding:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric-card{cursor:pointer;transition:transform .15s}
.metric-card:hover{transform:translateY(-2px)}
.metric-card .m-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.metric-card .m-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.metric-card .m-val{font-size:26px;font-weight:800;letter-spacing:-.02em}
.metric-card .m-label{font-size:12px;color:var(--text-muted);font-weight:600}

.section-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px}

.task-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:8px;background:var(--glass-bg-subtle);border:1px solid var(--glass-border-subtle);transition:background .15s}
.task-row:hover{background:var(--bg-hover)}
.task-row.overdue{background:rgba(255,59,48,.08);border-color:rgba(255,59,48,.20)}
.task-row.today{background:rgba(255,204,0,.08);border-color:rgba(255,204,0,.25)}
.task-row.done{opacity:.55}
.task-row.done .t-title{text-decoration:line-through}
.t-check{width:21px;height:21px;border-radius:50%;border:2px solid var(--border-solid);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.task-row.done .t-check{background:var(--prio-low);border-color:var(--prio-low)}
.t-body{min-width:0}
.t-title{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-meta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:11px;color:var(--text-muted);flex-wrap:wrap}
.t-meta .proj-dot{width:7px;height:7px}
.t-prog{width:60px;height:4px;background:var(--glass-border-subtle);border-radius:99px;overflow:hidden}
.t-prog span{display:block;height:100%;background:var(--accent)}
.prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.t-actions{display:flex;align-items:center;gap:4px}
.t-actions button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text-muted)}
.t-actions button:hover{background:var(--glass-bg-strong);color:var(--text-primary)}
.empty-state{text-align:center;padding:34px 20px;color:var(--text-muted)}
.empty-state .ico{font-size:30px;margin-bottom:8px}

/* mini calendar */
.mini-cal{width:100%}
.mini-cal .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;font-size:13px}
.mini-cal .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px}
.mini-cal .mc-dow{color:var(--text-muted);font-weight:700;padding-bottom:4px}
.mini-cal .mc-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;position:relative}
.mini-cal .mc-day:hover{background:var(--bg-hover)}
.mini-cal .mc-day.today{background:var(--accent);color:#fff;font-weight:800}
.mini-cal .mc-day.muted{opacity:.3}
.mini-cal .mc-dots{display:flex;gap:2px;position:absolute;bottom:2px}
.mini-cal .mc-dots span{width:3.5px;height:3.5px;border-radius:50%}

/* tabs */
.tabs-bar{display:flex;gap:4px;background:var(--glass-bg-subtle);border-radius:12px;padding:3px;margin-bottom:14px;width:fit-content}
.tabs-bar button{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.tabs-bar button.active{background:var(--glass-bg-strong);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab-panel{display:none}.tab-panel.active{display:block}

.week-bars{display:flex;flex-direction:column;gap:10px}
.week-bar-row{display:grid;grid-template-columns:70px 1fr 60px;align-items:center;gap:10px;font-size:12px}
.week-bar-track{height:10px;background:var(--glass-border-subtle);border-radius:99px;overflow:hidden}
.week-bar-fill{height:100%;border-radius:99px;transition:width .4s}

.heatmap-wrap{overflow-x:auto}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.hm-cell{width:12px;height:12px;border-radius:3px;background:var(--glass-border-subtle);cursor:pointer}
.streak-line{margin-top:10px;font-size:13px;font-weight:700;color:#FF7A18}

.proj-bar-row{margin-bottom:12px}
.proj-bar-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
.proj-bar-track{height:12px;border-radius:99px;background:var(--glass-border-subtle);display:flex;overflow:hidden}

/* project pills / agenda */
.filters-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters-row button{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:600;background:var(--glass-bg-subtle);border:1px solid var(--glass-border-subtle);color:var(--text-secondary)}
.filters-row button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.agenda-sub{display:flex;gap:6px;margin-bottom:16px}
.agenda-sub button{padding:8px 15px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.agenda-sub button.active{background:var(--accent-tint);color:var(--accent)}
.day-group{margin-bottom:18px}
.day-group h4{font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week-col{min-height:120px}
.week-col h5{font-size:11px;font-weight:700;text-align:center;margin-bottom:8px;color:var(--text-muted)}
.gcal-event{border-left:3px solid #4285F4;background:rgba(66,133,244,.08);border-radius:8px;padding:6px 9px;margin:4px 0;font-size:11.5px}
.gcal-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(66,133,244,.15);color:#4285F4;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700}
.conflict{outline:2px solid #FFCC00}

/* timer */
.timer-wrap{display:flex;flex-direction:column;align-items:center;padding:50px 20px}
.timer-circle{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:24px}
.timer-circle svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer-time{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}
.timer-controls{display:flex;gap:12px}
.timer-controls button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}

/* settings */
.settings-sec{margin-bottom:26px}
.settings-sec h3{font-size:14px;font-weight:700;margin-bottom:12px}
.accent-row{display:flex;gap:10px}
.accent-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;position:relative}
.accent-swatch.active{border-color:var(--text-primary)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--glass-border-subtle)}
.toggle{width:42px;height:24px;border-radius:99px;background:var(--glass-border-subtle);position:relative;cursor:pointer;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}

/* modals */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,30,.35);backdrop-filter:blur(6px);z-index:900;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.active{display:flex}
.modal{background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:20px;box-shadow:var(--glass-shadow-lg);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:22px}
.modal h3{font-size:16px;font-weight:700}
.modal .close-x{width:30px;height:30px;border-radius:8px;background:var(--glass-bg-subtle);display:grid;place-items:center}
.prio-pick{display:flex;gap:8px}
.prio-pick button{flex:1;padding:9px 4px;border-radius:11px;font-size:12px;font-weight:700;border:1.5px solid var(--glass-border-subtle);display:flex;flex-direction:column;align-items:center;gap:4px}
.prio-pick button.sel{border-color:currentColor}
.icon-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icon-pick button{aspect-ratio:1;border-radius:11px;background:var(--glass-bg-subtle);display:grid;place-items:center}
.icon-pick button.sel{background:var(--accent);color:#fff}

/* toast / confetti */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:600;box-shadow:var(--glass-shadow-lg);animation:toastIn .25s ease}
.toast.success{color:var(--prio-low)}.toast.error{color:var(--prio-urgent)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.confetti-piece{position:fixed;width:8px;height:8px;z-index:3000;pointer-events:none;top:-10px}

@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .header{display:none}
  .mobile-header{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-shrink:0}
  .mobile-header .logo{font-weight:800;font-size:16px;flex:1}
  .main{padding:16px;padding-bottom:calc(90px + var(--safe-bottom))}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;padding:8px 6px calc(8px + var(--safe-bottom));background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);border-top:1px solid var(--glass-border-subtle);z-index:500;justify-content:space-around}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--text-muted);padding:4px 8px}
  .bottom-nav button.active{color:var(--accent)}
  .fab{display:grid;position:fixed;right:18px;bottom:calc(78px + var(--safe-bottom));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#fff;place-items:center;box-shadow:0 8px 24px -4px var(--accent-glow);z-index:500}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .week-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-inner">
      <div class="auth-logo"><div class="mark"><i data-lucide="waves" style="width:22px;height:22px;color:#fff"></i></div>Flowly</div>
      <div class="auth-tagline">Seu produtividade, visualmente organizada.</div>
      <div class="auth-tabs"><button id="tabLogin" class="active">Entrar</button><button id="tabSignup">Criar conta</button></div>
      <div class="auth-form active" id="formLogin">
        <h2>Bem-vindo de volta</h2><div class="sub">Acesse suas tarefas e projetos.</div>
        <div class="field"><label>E-mail</label><input type="email" id="loginEmail" autocomplete="email"><div class="field-hint" id="loginEmailHint"></div></div>
        <div class="field"><label>Senha</label><input type="password" id="loginPwd" autocomplete="current-password"><div class="field-hint" id="loginPwdHint"></div></div>
        <button class="auth-btn" id="btnLogin">Entrar</button>
        <div class="auth-sep">ou</div>
        <button class="google-btn" id="btnGoogle1"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Entrar com Google</button>
        <a class="auth-link" id="btnForgot">Esqueci minha senha</a>
      </div>
      <div class="auth-form" id="formSignup">
        <h2>Crie sua conta</h2><div class="sub">Comece a organizar em segundos.</div>
        <div class="field"><label>Nome completo</label><input type="text" id="signupName" autocomplete="name"></div>
        <div class="field"><label>E-mail</label><input type="email" id="signupEmail" autocomplete="email"><div class="field-hint" id="signupEmailHint"></div></div>
        <div class="field"><label>Senha</label><input type="password" id="signupPwd" autocomplete="new-password"><div class="field-hint" id="signupPwdHint">Mínimo 6 caracteres</div></div>
        <button class="auth-btn" id="btnSignup">Criar conta</button>
        <div class="auth-sep">ou</div>
        <button class="google-btn" id="btnGoogle2"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Criar com Google</button>
      </div>
    </div>
    <div class="auth-foot">🔒 Seus dados são privados e sincronizados na nuvem.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="appRoot">
  <aside class="sidebar">
    <div class="side-logo"><div class="mark"><i data-lucide="waves" style="width:16px;height:16px;color:#fff"></i></div>Flowly</div>
    <nav class="side-nav" id="sideNav">
      <button data-view="dashboard"><i data-lucide="layout-dashboard" style="width:16px;height:16px"></i>Dashboard</button>
      <button data-view="tasks"><i data-lucide="check-square" style="width:16px;height:16px"></i>Tarefas</button>
      <button data-view="agenda"><i data-lucide="calendar" style="width:16px;height:16px"></i>Agenda</button>
      <button data-view="timer"><i data-lucide="timer" style="width:16px;height:16px"></i>Timer</button>
      <button data-view="reports"><i data-lucide="bar-chart-3" style="width:16px;height:16px"></i>Relatórios</button>
    </nav>
    <div class="side-div"></div>
    <div class="side-sec-title">Projetos</div>
    <div class="proj-list" id="projList"></div>
    <button class="btn-add-proj" id="btnNewProject"><i data-lucide="plus" style="width:15px;height:15px"></i>Novo projeto</button>
    <div class="side-div"></div>
    <button class="side-nav-item" data-view="settings" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--text-secondary)" onclick="setView('settings')"><i data-lucide="settings" style="width:16px;height:16px"></i>Configurações</button>
    <div class="sidebar-foot">
      <div class="avatar" id="sideAvatar">?</div>
      <div class="who"><b id="sideName">Usuário</b><span id="sideEmail">—</span></div>
      <button class="icon-btn" id="btnLogout" title="Sair"><i data-lucide="log-out" style="width:16px;height:16px"></i></button>
    </div>
  </aside>

  <div class="shell">
    <header class="header">
      <div class="search-box"><i data-lucide="search" style="width:15px;height:15px;color:var(--text-muted)"></i><input id="globalSearch" placeholder="Buscar tarefas..."></div>
      <div class="header-actions">
        <span id="gcalIndicator" class="gcal-badge" style="display:none"></span>
        <button class="icon-btn" id="themeBtn" title="Tema"><i data-lucide="moon"></i></button>
        <button class="icon-btn" id="notifBtn" title="Notificações"><i data-lucide="bell"></i></button>
      </div>
    </header>
    <div class="mobile-header">
      <div class="logo">Flowly</div>
      <button class="icon-btn" id="themeBtnM"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="moreBtnM"><i data-lucide="menu"></i></button>
    </div>

    <main class="main" id="mainView"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button data-view="dashboard"><i data-lucide="layout-dashboard" style="width:19px;height:19px"></i>Início</button>
    <button data-view="tasks"><i data-lucide="check-square" style="width:19px;height:19px"></i>Tarefas</button>
    <button data-view="agenda"><i data-lucide="calendar" style="width:19px;height:19px"></i>Agenda</button>
    <button data-view="timer"><i data-lucide="timer" style="width:19px;height:19px"></i>Timer</button>
    <button data-view="more"><i data-lucide="menu" style="width:19px;height:19px"></i>Mais</button>
  </nav>
  <button class="fab" id="fabAdd"><i data-lucide="plus" style="width:24px;height:24px"></i></button>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
/* ============================================================
   5. FIREBASE INIT
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup,
  sendPasswordResetEmail, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc,
  collection, onSnapshot, serverTimestamp, addDoc, query
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAqX25rq38oi8SmIvMT23UOff-H3xE9Tdc",
  authDomain: "taskflow-50000.firebaseapp.com",
  projectId: "taskflow-50000",
  storageBucket: "taskflow-50000.firebasestorage.app",
  messagingSenderId: "674043564283",
  appId: "1:674043564283:web:8188b61a5aa734b8da605e"
};
const fbApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();

const GCAL_CONFIG = {
  clientId: "674043564283-0e0em8k1gdipv0tn6kk9pckecp3odvof.apps.googleusercontent.com",
  apiKey: "AIzaSyAqX25rq38oi8SmIvMT23UOff-H3xE9Tdc",
  calendarId: "primary",
  scope: "https://www.googleapis.com/auth/calendar.events"
};

/* ============================================================
   6. STATE
   ============================================================ */
const ACCENTS = {
  indigo:{a:"#6366F1",s:"#818CF8"}, blue:{a:"#3B82F6",s:"#60A5FA"},
  green:{a:"#10B981",s:"#34D399"}, orange:{a:"#F59E0B",s:"#FBBF24"},
  pink:{a:"#EC4899",s:"#F472B6"}, purple:{a:"#8B5CF6",s:"#A78BFA"}
};
const PROJECT_ICONS = ["folder","briefcase","graduation-cap","heart","home","dumbbell","book-open","plane","code","music","palette","piggy-bank"];

let state = {
  user:null,
  profile:{ name:"", email:"", theme:"light", accent:"indigo", dailyGoal:5,
            pomodoro:{focus:25,short:5,long:15}, streak:0, bestStreak:0, lastActiveDate:null,
            notif:{summary:true, reminders:true, endOfDay:true, streak:true, weekly:true}, gcalConnected:false },
  projects:[], tasks:[],
  ui:{ view:"dashboard", activeProject:null, dashTab:"weekly", agendaSub:"today", search:"", calMonth:new Date() }
};
let unsubProjects=null, unsubTasks=null;
const DEFAULT_PROJECT_ID = "_none";

function uid(p){ return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7); }
function reportFirestoreError(e,context){
  console.error(context,e);
  if(e && e.code==='permission-denied'){
    toast('Permissão negada pelo Firestore — atualize as regras de segurança (veja o comentário no fim do arquivo)','error');
  } else {
    toast('Erro ao salvar: '+(e?.message||context),'error');
  }
}
function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return ""; const d=new Date(s+"T00:00"); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }

/* ============================================================
   7. AUTH FLOW
   ============================================================ */
document.getElementById('tabLogin').onclick=()=>switchAuthTab('login');
document.getElementById('tabSignup').onclick=()=>switchAuthTab('signup');
function switchAuthTab(t){
  document.getElementById('tabLogin').classList.toggle('active',t==='login');
  document.getElementById('tabSignup').classList.toggle('active',t==='signup');
  document.getElementById('formLogin').classList.toggle('active',t==='login');
  document.getElementById('formSignup').classList.toggle('active',t==='signup');
}
document.getElementById('btnLogin').onclick=async()=>{
  const email=document.getElementById('loginEmail').value.trim(), pwd=document.getElementById('loginPwd').value;
  const hint=document.getElementById('loginPwdHint'); hint.textContent="";
  if(!email||!pwd){ hint.textContent="Preencha e-mail e senha."; return; }
  try{ await signInWithEmailAndPassword(auth,email,pwd); }
  catch(e){ hint.textContent="E-mail ou senha inválidos."; }
};
document.getElementById('btnSignup').onclick=async()=>{
  const name=document.getElementById('signupName').value.trim();
  const email=document.getElementById('signupEmail').value.trim();
  const pwd=document.getElementById('signupPwd').value;
  const hint=document.getElementById('signupPwdHint');
  if(!name||!email||pwd.length<6){ hint.textContent="Verifique os campos (senha ≥ 6 caracteres)."; return; }
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pwd);
    await updateProfile(cred.user,{displayName:name});
    await setDoc(doc(db,'users',cred.user.uid),{ name, email, theme:'light', accent:'indigo', dailyGoal:5,
      pomodoro:{focus:25,short:5,long:15}, streak:0, bestStreak:0, lastActiveDate:null,
      notif:{summary:true,reminders:true,endOfDay:true,streak:true,weekly:true}, gcalConnected:false, createdAt:Date.now() });
  }catch(e){ hint.textContent = e.code==='auth/email-already-in-use' ? "E-mail já cadastrado." : "Erro ao criar conta."; }
};
async function googleAuth(){
  try{
    const cred=await signInWithPopup(auth,googleProvider);
    const ref=doc(db,'users',cred.user.uid);
    const snap=await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref,{ name:cred.user.displayName||'Usuário', email:cred.user.email, theme:'light', accent:'indigo',
        dailyGoal:5, pomodoro:{focus:25,short:5,long:15}, streak:0, bestStreak:0, lastActiveDate:null,
        notif:{summary:true,reminders:true,endOfDay:true,streak:true,weekly:true}, gcalConnected:false, createdAt:Date.now() });
    }
  }catch(e){ toast('Erro ao entrar com Google','error'); }
}
document.getElementById('btnGoogle1').onclick=googleAuth;
document.getElementById('btnGoogle2').onclick=googleAuth;
document.getElementById('btnForgot').onclick=async()=>{
  const email=document.getElementById('loginEmail').value.trim();
  if(!email){ toast('Digite seu e-mail primeiro','error'); return; }
  try{ await sendPasswordResetEmail(auth,email); toast('E-mail de redefinição enviado!','success'); }
  catch(e){ toast('Erro ao enviar e-mail','error'); }
};
document.getElementById('btnLogout').onclick=()=>signOut(auth);

onAuthStateChanged(auth, async (user)=>{
  if(user){
    state.user=user;
    document.getElementById('authScreen').classList.remove('active');
    document.getElementById('appRoot').classList.add('active');
    await loadUserData(user.uid);
    lucide.createIcons();
  } else {
    if(unsubProjects) unsubProjects(); if(unsubTasks) unsubTasks();
    state.user=null; state.projects=[]; state.tasks=[];
    document.getElementById('appRoot').classList.remove('active');
    document.getElementById('authScreen').classList.add('active');
    lucide.createIcons();
  }
});

/* ============================================================
   8. DATA LOADING (Firestore realtime)
   ============================================================ */
async function loadUserData(uid_){
  const uref=doc(db,'users',uid_);
  const usnap=await getDoc(uref);
  if(usnap.exists()) Object.assign(state.profile, usnap.data());
  applyTheme(); applyAccent();
  document.getElementById('sideName').textContent=state.profile.name||'Usuário';
  document.getElementById('sideEmail').textContent=state.profile.email||'';
  document.getElementById('sideAvatar').textContent=(state.profile.name||'U').slice(0,1).toUpperCase();

  if(unsubProjects) unsubProjects();
  unsubProjects = onSnapshot(collection(db,'users',uid_,'projects'), snap=>{
    state.projects = snap.docs.map(d=>({id:d.id,...d.data()}));
    ensureDefaultProject();
    renderSidebarProjects();
    render();
  });
  if(unsubTasks) unsubTasks();
  unsubTasks = onSnapshot(collection(db,'users',uid_,'tasks'), snap=>{
    state.tasks = snap.docs.map(d=>({id:d.id,...d.data()}));
    computeStreak();
    render();
  });

  maybeShowDailySummary();
  scheduleNotificationChecks();
}
async function ensureDefaultProject(){
  if(!state.projects.find(p=>p.id===DEFAULT_PROJECT_ID)){
    try{
      await setDoc(doc(db,'users',state.user.uid,'projects',DEFAULT_PROJECT_ID),
        { name:"Sem projeto", color:"#9AA3AF", icon:"folder", desc:"", archived:false, createdAt:Date.now(), locked:true });
    }catch(e){ reportFirestoreError(e,'ensureDefaultProject'); }
  }
}
async function saveProfileField(patch){
  Object.assign(state.profile,patch);
  await updateDoc(doc(db,'users',state.user.uid), patch);
}

/* ============================================================
   9. PROJECTS CRUD
   ============================================================ */
function renderSidebarProjects(){
  const wrap=document.getElementById('projList'); wrap.innerHTML='';
  const active = state.projects.filter(p=>!p.archived).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const allItem = document.createElement('div');
  allItem.className='proj-item'+(state.ui.activeProject===null?' active':'');
  allItem.innerHTML = `<span class="proj-dot" style="background:var(--accent)"></span><span class="pname">Todas as tarefas</span><span class="pcount">${state.tasks.filter(t=>t.status!=='done').length}</span>`;
  allItem.onclick=()=>{ state.ui.activeProject=null; renderSidebarProjects(); render(); };
  wrap.appendChild(allItem);
  active.forEach(p=>{
    const openCount = state.tasks.filter(t=>t.projectId===p.id && t.status!=='done').length;
    const el=document.createElement('div');
    el.className='proj-item'+(state.ui.activeProject===p.id?' active':'');
    el.innerHTML = `<span class="proj-dot" style="background:${p.color}"></span><span class="pname">${escapeHtml(p.name)}</span><span class="pcount">${openCount}</span>
      ${p.locked?'':'<button class="pmenu" title="Opções"><i data-lucide="more-horizontal" style="width:14px;height:14px"></i></button>'}`;
    el.onclick=(e)=>{ if(e.target.closest('.pmenu')) return; state.ui.activeProject=p.id; renderSidebarProjects(); render(); };
    const menuBtn=el.querySelector('.pmenu');
    if(menuBtn) menuBtn.onclick=(e)=>{ e.stopPropagation(); openProjectContextMenu(p, menuBtn); };
    wrap.appendChild(el);
  });
  lucide.createIcons();
}
function openProjectContextMenu(p, anchor){
  document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
  const menu=document.createElement('div');
  menu.className='ctx-menu';
  menu.style.cssText='position:absolute;background:var(--glass-bg-strong);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--glass-shadow-lg);padding:6px;z-index:999;min-width:150px';
  const r=anchor.getBoundingClientRect();
  menu.style.top=(r.bottom+4)+'px'; menu.style.left=(r.left-110)+'px';
  menu.innerHTML=`<button style="display:flex;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;gap:8px" id="ctxEdit">Editar</button>
    <button style="display:flex;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;gap:8px" id="ctxArchive">${p.archived?'Reativar':'Arquivar'}</button>`;
  document.body.appendChild(menu);
  menu.querySelector('#ctxEdit').onclick=()=>{ menu.remove(); openProjectModal(p); };
  menu.querySelector('#ctxArchive').onclick=async()=>{ menu.remove(); await updateDoc(doc(db,'users',state.user.uid,'projects',p.id),{archived:!p.archived}); toast(p.archived?'Projeto reativado':'Projeto arquivado'); };
  setTimeout(()=>document.addEventListener('click',function h(){ menu.remove(); document.removeEventListener('click',h); },{once:true}),0);
}
document.getElementById('btnNewProject').onclick=()=>openProjectModal(null);
function openProjectModal(p){
  const activeCount = state.projects.filter(x=>!x.archived && !x.locked).length;
  if(!p && activeCount>=20){ toast('Limite de 20 projetos ativos atingido','error'); return; }
  const modal=document.createElement('div'); modal.className='modal-bg active';
  const color=p?.color||'#6366F1'; const icon=p?.icon||'folder';
  modal.innerHTML=`<div class="modal" style="max-width:420px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3>${p?'Editar projeto':'Novo projeto'}</h3><button class="close-x">✕</button>

const WEEKDAYS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function parseQuickAdd(raw){
  let text=raw; let priority='normal'; let dueDate=null; let projectId=state.ui.activeProject;

  const prioMatch=text.match(/#(urgente|alta|normal|baixa)\b/i);
  if(prioMatch){ const m={urgente:'urgent',alta:'high',normal:'normal',baixa:'low'}; priority=m[prioMatch[1].toLowerCase()]; text=text.replace(prioMatch[0],'').trim(); }

  const projMatch=text.match(/@([^\s#@]+)/);
  if(projMatch){
    const name=projMatch[1].toLowerCase();
    const found=state.projects.find(p=>!p.archived && p.name.toLowerCase().startsWith(name));
    if(found){ projectId=found.id; text=text.replace(projMatch[0],'').trim(); }
  }

  const now=new Date();
  if(/\bhoje\b/i.test(text)){ dueDate=todayStr(now); text=text.replace(/\bhoje\b/i,'').trim(); }
  else if(/\bamanh[ãa]\b/i.test(text)){ const d=new Date(now); d.setDate(d.getDate()+1); dueDate=todayStr(d); text=text.replace(/\bamanh[ãa]\b/i,'').trim(); }
  else if(/pr[óo]xima semana/i.test(text)){ const d=new Date(now); d.setDate(d.getDate()+7); dueDate=todayStr(d); text=text.replace(/pr[óo]xima semana/i,'').trim(); }
  else{
    for(let i=0;i<7;i++){
      const re=new RegExp('\\b'+WEEKDAYS[i]+'(-feira)?\\b','i');
      if(re.test(text)){
        const d=new Date(now); const diff=(i - d.getDay() + 7) % 7 || 7;
        d.setDate(d.getDate()+diff); dueDate=todayStr(d); text=text.replace(re,'').trim(); break;
      }
    }
  }
  const timeMatch=text.match(/\b([01]?\d|2[0-3])h([0-5]\d)?\b/);
  let dueTime=null;
  if(timeMatch){ dueTime=timeMatch[1].padStart(2,'0')+':'+(timeMatch[2]||'00'); text=text.replace(timeMatch[0],'').trim(); }

  text=text.replace(/\s{2,}/g,' ').trim();
  return { title:text||raw, priority, dueDate, dueTime, projectId: projectId || DEFAULT_PROJECT_ID };
}
async function quickAddSubmit(text){
  if(!text.trim()) return;
  const parsed=parseQuickAdd(text);
  await createTask(parsed);
}
async function createTask(partial){
  const id=uid('task');
  const task={
    title: partial.title||'Nova tarefa', description: partial.description||'',
    projectId: partial.projectId||DEFAULT_PROJECT_ID, priority: partial.priority||'normal',
    status:'todo', dueDate: partial.dueDate||null, dueTime: partial.dueTime||null,
    estimateMinutes: partial.estimateMinutes||0, timeSpentMinutes:0, tags: partial.tags||[],
    subtasks: partial.subtasks||[], recurrence: partial.recurrence||'none',
    googleEventId:null, gcalSync:false, createdAt:Date.now(), updatedAt:Date.now(), completedAt:null
  };
  try{
    await setDoc(doc(db,'users',state.user.uid,'tasks',id), task);
    if(task.dueDate && state.profile.gcalConnected) gcalUpsertEvent({id,...task});
    toast('Tarefa criada!','success');
  }catch(e){ reportFirestoreError(e,'createTask'); }
}
async function updateTask(id,patch){
  patch.updatedAt=Date.now();
  try{
    await updateDoc(doc(db,'users',state.user.uid,'tasks',id), patch);
    const t=state.tasks.find(x=>x.id===id);
    if(t && (patch.dueDate!==undefined) && state.profile.gcalConnected) gcalUpsertEvent({...t,...patch,id});
  }catch(e){ reportFirestoreError(e,'updateTask'); }
}
async function toggleComplete(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const done = t.status!=='done';
  await updateTask(id,{status: done?'done':'todo', completedAt: done?Date.now():null});
  if(done){
    if(t.priority==='urgent') fireConfetti();
    checkDailyGoal();
    if(state.profile.gcalConnected && t.googleEventId) gcalMarkDone(t);
  }
}
async function deleteTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(t?.googleEventId && state.profile.gcalConnected) gcalDeleteEvent(t);
  await deleteDoc(doc(db,'users',state.user.uid,'tasks',id));

async function snoozeTask(id,days){

  toast('Tarefa adiada');
}

   11. STREAK / GAMIFICATION
   ============================================================ */
function computeStreak(){
  const doneDates=new Set(state.tasks.filter(t=>t.status==='done'&&t.completedAt).map(t=>todayStr(new Date(t.completedAt))));
  let streak=0; let d=new Date();
  if(!doneDates.has(todayStr(d))) d.setDate(d.getDate()-1);
  while(doneDates.has(todayStr(d))){ streak++; d.setDate(d.getDate()-1); }
  state.profile.streak=streak;
  if(streak>(state.profile.bestStreak||0)){
    state.profile.bestStreak=streak;
    saveProfileField({bestStreak:streak});
    if([7,14,30].includes(streak) && state.profile.notif?.streak) notifyStreak(streak);
  }
}
function notifyStreak(n){
  toast(`🔥 Sequência de ${n} dias! Continue assim!`,'success');
  if(Notification && Notification.permission==='granted') new Notification('Flowly',{body:`Sequência de ${n} dias seguidos! 🔥`});
}
function checkDailyGoal(){
  const doneToday=state.tasks.filter(t=>t.status==='done'&&t.completedAt&&todayStr(new Date(t.completedAt))===todayStr()).length;
  if(doneToday===state.profile.dailyGoal) toast('🎯 Meta atingida! Parabéns!','success');
}
function fireConfetti(){
  const colors=['#FF3B30','#FF9500','#FFCC00','#34C759','#5E5CE6','#AF52DE'];
  for(let i=0;i<28;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=(45+Math.random()*10)+'vw';
    p.style.background=colors[i%colors.length];
    p.style.borderRadius=Math.random()>.5?'50%':'2px';
    const dx=(Math.random()-.5)*300, dur=1.1+Math.random()*.8;
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,90vh) rotate(${360+Math.random()*360}deg)`,opacity:0}],{duration:dur*1000,easing:'cubic-bezier(.25,.46,.45,.94)'});
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),dur*1000+100);
  }
}

function scheduleNotificationChecks(){
  setInterval(()=>{
    const now=new Date();
    if(state.profile.notif?.endOfDay && now.getHours()===20 && now.getMinutes()===0){
      const doneToday=state.tasks.filter(t=>t.status==='done'&&t.completedAt&&todayStr(new Date(t.completedAt))===todayStr()).length;
      const totalToday=state.tasks.filter(t=>t.dueDate===todayStr()).length;
      toast(`Você concluiu ${doneToday} de ${totalToday} tarefas hoje.`);
    }
    if(state.profile.notif?.weekly && now.getDay()===0 && now.getHours()===18 && now.getMinutes()===0){
      toast('📊 Sua revisão semanal está pronta — veja em Relatórios.');
    }
    if(state.profile.notif?.reminders){
      state.tasks.forEach(t=>{
        if(t.status==='done' || !t.dueDate || !t.dueTime) return;
        const dt=new Date(t.dueDate+'T'+t.dueTime);
        const diffMin=(dt-now)/60000;
        if(diffMin>29 && diffMin<31 && !t._reminded){
          t._reminded=true;
          if(Notification && Notification.permission==='granted') new Notification('Flowly — lembrete',{body:`"${t.title}" vence em 30 minutos`});
          toast(`⏰ "${t.title}" vence em 30 minutos`);
        }
      });
    }
  },60000);
}

function renderMiniCalendar(){
  const m=state.ui.calMonth; const y=m.getFullYear(), mo=m.getMonth();
  const first=new Date(y,mo,1); const startDow=first.getDay();
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const monthName=m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const tasksByDate={};
  state.tasks.forEach(t=>{ if(t.dueDate){ (tasksByDate[t.dueDate]=tasksByDate[t.dueDate]||[]).push(t); } });
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="mc-day muted"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=todayStr(new Date(y,mo,d));
    const isToday=dateStr===todayStr();
    const dayTasks=tasksByDate[dateStr]||[];
    const dots=dayTasks.slice(0,3).map(t=>`<span style="background:${({urgent:'var(--prio-urgent)',high:'var(--prio-high)',normal:'var(--prio-normal)',low:'var(--prio-low)'})[t.priority]}"></span>`).join('');
    cells+=`<div class="mc-day ${isToday?'today':''}">${d}<div class="mc-dots">${dots}</div></div>`;
  }
  return `<div class="mini-cal"><div class="mc-head"><span>${monthName}</span></div>
    <div class="mc-grid">${['D','S','T','Q','Q','S','S'].map(d=>`<div class="mc-dow">${d}</div>`).join('')}${cells}</div></div>`;
}
function renderWeeklyProgress(){
  const goal=state.profile.dailyGoal||5;
  const days=[]; const now=new Date(); const dow=now.getDay();
  const monday=new Date(now); monday.setDate(now.getDate()-((dow+6)%7));
  const labels=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let rows='';
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    const ds=todayStr(d);
    const done=state.tasks.filter(t=>t.status==='done'&&t.completedAt&&todayStr(new Date(t.completedAt))===ds).length;
    const pct=Math.min(100,Math.round(done/goal*100));
    const color = pct>=100?'var(--prio-low)':pct>=50?'var(--prio-high)':'var(--prio-urgent)';
    rows+=`<div class="week-bar-row"><span>${labels[i]}</span><div class="week-bar-track"><div class="week-bar-fill" style="width:${pct}%;background:${color}"></div></div><span>${done}/${goal}</span></div>`;
  }
  return `<div class="week-bars">${rows}</div>`;
}
function renderHeatmap(){
  const weeks=12; const now=new Date(); const cells=[]; const countByDate={};
  state.tasks.forEach(t=>{ if(t.status==='done'&&t.completedAt){ const ds=todayStr(new Date(t.completedAt)); countByDate[ds]=(countByDate[ds]||0)+1; } });
  const start=new Date(now); start.setDate(now.getDate()-(weeks*7-1));
  let html='';
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=todayStr(d); const c=countByDate[ds]||0;
    const bg=c===0?'var(--glass-border-subtle)':c<=2?'#B7EFC5':c<=4?'#4FCE79':'#1FA05C';
    html+=`<div class="hm-cell" style="background:${bg}" title="${ds}: ${c} tarefa(s)"></div>`;
  }
  return `<div class="heatmap-wrap"><div class="heatmap">${html}</div></div><div class="streak-line">🔥 ${state.profile.streak||0} dias seguidos · recorde: ${state.profile.bestStreak||0}</div>`;
}
function renderProjectBars(){
  const projects=state.projects.filter(p=>!p.archived);
  const rows=projects.map(p=>{
    const tasks=state.tasks.filter(t=>t.projectId===p.id);
    const done=tasks.filter(t=>t.status==='done').length, total=tasks.length;
    const pct=total?Math.round(done/total*100):0;
    return {p,done,open:total-done,total,pct};
  }).filter(r=>r.total>0).sort((a,b)=>b.done-a.done);
  if(!rows.length) return `<div class="empty-state">Crie projetos e tarefas para ver estatísticas aqui.</div>`;
  return rows.map(r=>`<div class="proj-bar-row"><div class="proj-bar-top"><span>${escapeHtml(r.p.name)}</span><span>${r.pct}%</span></div>
    <div class="proj-bar-track"><div style="width:${r.total?r.done/r.total*100:0}%;background:${r.p.color}"></div><div style="width:${r.total?r.open/r.total*100:0}%;background:var(--glass-border-subtle)"></div></div></div>`).join('');
}

let timerState={ running:false, mode:'focus', remaining: (state.profile.pomodoro?.focus||25)*60, interval:null, taskId:null };
function renderTimerHTML(){
  const total=(timerState.mode==='focus'?state.profile.pomodoro.focus:timerState.mode==='short'?state.profile.pomodoro.short:state.profile.pomodoro.long)*60;
  const pct=1-(timerState.remaining/total);
  const min=String(Math.floor(timerState.remaining/60)).padStart(2,'0');
  const sec=String(timerState.remaining%60).padStart(2,'0');
  const circumference=2*Math.PI*100;
  return `<div class="page-head"><h1>Timer & Pomodoro</h1></div>
  <div class="timer-wrap card glass">
    <div class="tabs-bar">
      <button data-tmode="focus" class="${timerState.mode==='focus'?'active':''}">Foco</button>
      <button data-tmode="short" class="${timerState.mode==='short'?'active':''}">Pausa curta</button>
      <button data-tmode="long" class="${timerState.mode==='long'?'active':''}">Pausa longa</button>
    </div>
    <div class="timer-circle">
      <svg width="220" height="220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--glass-border-subtle)" stroke-width="10"/>
        <circle cx="110" cy="110" r="100" fill="none" stroke="var(--accent)" stroke-width="10" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-pct)}" stroke-linecap="round"/></svg>
      <div class="timer-time">${min}:${sec}</div>
    </div>
    <div class="timer-controls">
      <button class="btn-sec" id="tmrReset"><i data-lucide="rotate-ccw" style="width:18px;height:18px"></i></button>
      <button class="btn-primary" id="tmrToggle" style="width:64px;height:64px;border-radius:50%;justify-content:center">${timerState.running?'<i data-lucide="pause"></i>':'<i data-lucide="play"></i>'}</button>
      <button class="btn-sec" id="tmrSkip"><i data-lucide="skip-forward" style="width:18px;height:18px"></i></button>
    </div>
  </div>`;
}
function bindTimerEvents(){
  document.querySelectorAll('[data-tmode]').forEach(b=>b.onclick=()=>{ timerState.mode=b.dataset.tmode; resetTimer(); render(); });
  const toggle=document.getElementById('tmrToggle'); if(toggle) toggle.onclick=()=>{ timerState.running?pauseTimer():startTimer(); render(); };
  const reset=document.getElementById('tmrReset'); if(reset) reset.onclick=()=>{ resetTimer(); render(); };
  const skip=document.getElementById('tmrSkip'); if(skip) skip.onclick=()=>{ completeTimerCycle(); };
}
function startTimer(){
  timerState.running=true;
  timerState.interval=setInterval(()=>{
    timerState.remaining--;
    if(timerState.remaining<=0) completeTimerCycle();
    else { const t=document.querySelector('.timer-time'); if(t){ const m=String(Math.floor(timerState.remaining/60)).padStart(2,'0'), s=String(timerState.remaining%60).padStart(2,'0'); t.textContent=`${m}:${s}`; } }
  },1000);
}
function pauseTimer(){ timerState.running=false; clearInterval(timerState.interval); }
function resetTimer(){
  pauseTimer();
  const total=(timerState.mode==='focus'?state.profile.pomodoro.focus:timerState.mode==='short'?state.profile.pomodoro.short:state.profile.pomodoro.long)*60;
  timerState.remaining=total;
}
function completeTimerCycle(){
  pauseTimer();
  if(timerState.mode==='focus'){
    toast('🍅 Pomodoro concluído! Registrado na sua produtividade.','success');
    const marker={id:uid('pomo'),title:'[Pomodoro]',status:'done',completedAt:Date.now(),priority:'low',projectId:DEFAULT_PROJECT_ID,createdAt:Date.now(),updatedAt:Date.now(),dueDate:todayStr(),_pomodoro:true};
    setDoc(doc(db,'users',state.user.uid,'tasks',marker.id),marker);
  } else toast('Pausa concluída. Hora de voltar ao foco!');
  timerState.mode = timerState.mode==='focus' ? 'short' : 'focus';
  resetTimer(); render();
}

      <div style="flex:1"><b>${state.profile.gcalConnected?'Conectado':'Não conectado'}</b><div style="font-size:12px;color:var(--text-muted)">Tarefas com data são sincronizadas automaticamente.</div></div>
      <button class="btn-sec" id="btnGcalToggle">${state.profile.gcalConnected?'Desconectar':'Conectar'}</button>
    </div>
    <div style="margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--glass-bg-subtle);font-size:12px;font-family:monospace;line-height:1.8">
      <b style="font-family:inherit">Diagnóstico</b><br>
      Origem atual: ${location.origin}${location.protocol==='file:'?' ⚠️ (file:// não funciona)':''}<br>
      Script api.js (gapi): ${typeof gapi!=='undefined' ? '✅ carregado' : '❌ não carregado'}<br>
      Script gsi/client (google): ${typeof google!=='undefined' ? '✅ carregado' : '❌ não carregado'}<br>
      gapi.client.init: ${gcalState.gapiReady?'✅ ok':'❌ pendente/falhou'}<br>
      Token client (OAuth): ${gcalState.tokenClient?'✅ pronto':'❌ pendente/falhou'}<br>
      ${gcalState.loadFailed?`<span style="color:var(--prio-urgent)">Falha detectada: ${gcalState.loadFailedReason}</span><br>`:''}
      Client ID: ${GCAL_CONFIG.clientId}
    </div>
  </div>
  <div class="settings-sec card glass">
    <h3>Notificações</h3>
    <div class="toggle-row"><span>Resumo ao abrir o app</span><div class="toggle ${n.summary?'on':''}" data-notif="summary"></div></div>
    <div class="toggle-row"><span>Lembrete 30min antes</span><div class="toggle ${n.reminders?'on':''}" data-notif="reminders"></div></div>
    <div class="toggle-row"><span>Resumo do fim do dia (20h)</span><div class="toggle ${n.endOfDay?'on':''}" data-notif="endOfDay"></div></div>
    <div class="toggle-row"><span>Notificação de streak</span><div class="toggle ${n.streak?'on':''}" data-notif="streak"></div></div>
    <div class="toggle-row" style="border-bottom:none"><span>Revisão semanal (dom 18h)</span><div class="toggle ${n.weekly?'on':''}" data-notif="weekly"></div></div>
  </div>
  <div class="settings-sec card glass">
    <h3>Dados</h3>
    <button class="btn-sec" id="btnExport">⬇️ Exportar dados (JSON)</button>
  </div>
  <div class="settings-sec card glass">
    <h3>Conta</h3>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="avatar">${(state.profile.name||'U').slice(0,1).toUpperCase()}</div><div><b>${escapeHtml(state.profile.name||'')}</b><div style="font-size:12px;color:var(--text-muted)">${escapeHtml(state.profile.email||'')}</div></div></div>
    <button class="btn-sec" id="btnLogout2" style="color:var(--prio-urgent)">Sair da conta</button>
  </div>`;
}
function bindSettingsEvents(){
  document.querySelectorAll('[data-accent]').forEach(el=>el.onclick=async()=>{ await saveProfileField({accent:el.dataset.accent}); applyAccent(); render(); });
  const goalInput=document.getElementById('setGoal'); if(goalInput) goalInput.onchange=()=>saveProfileField({dailyGoal:parseInt(goalInput.value)||5});
  const savePomo=document.getElementById('savePomo'); if(savePomo) savePomo.onclick=()=>{
    saveProfileField({pomodoro:{focus:parseInt(document.getElementById('pomoFocus').value)||25,short:parseInt(document.getElementById('pomoShort').value)||5,long:parseInt(document.getElementById('pomoLong').value)||15}});
    toast('Configurações salvas','success');
  };
  document.querySelectorAll('[data-notif]').forEach(t=>t.onclick=()=>{
    const key=t.dataset.notif; const cur={...state.profile.notif}; cur[key]=!cur[key];
    saveProfileField({notif:cur}); render();
  });
  const exp=document.getElementById('btnExport'); if(exp) exp.onclick=()=>{
    const data=JSON.stringify({profile:state.profile,projects:state.projects,tasks:state.tasks},null,2);
    const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='flowly-dados.json'; a.click();
  };
  const lg2=document.getElementById('btnLogout2'); if(lg2) lg2.onclick=()=>signOut(auth);
  const gcalBtn=document.getElementById('btnGcalToggle'); if(gcalBtn) gcalBtn.onclick=()=>state.profile.gcalConnected?gcalDisconnect():gcalConnect();
  const gcalConnectBtn=document.getElementById('btnGcalConnect'); if(gcalConnectBtn) gcalConnectBtn.onclick=gcalConnect;
}

/* patch render() to bind view-specific events */
const _origRender=render;
render=function(){ _origRender(); if(state.ui.view==='settings') bindSettingsEvents(); if(state.ui.view==='timer') bindTimerEvents(); };

/* ============================================================
   22. TOASTS
   ============================================================ */
function toast(msg,type=''){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg;
  wrap.appendChild(el); setTimeout(()=>el.remove(),4200);
}
window.toast=toast;

/* ============================================================
   23. GOOGLE CALENDAR INTEGRATION
   ============================================================ */
let gcalState={ gapiReady:false, gsiReady:false, gapiInitStarted:false, tokenClient:null, accessToken:null, events:[] };
window.gapiLoaded=()=>{
  if(typeof gapi==='undefined' || gcalState.gapiInitStarted) return;
  gcalState.gapiInitStarted=true;
  gapi.load('client',async()=>{
    try{
      await gapi.client.init({apiKey:GCAL_CONFIG.apiKey,discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest']});
      gcalState.gapiReady=true;
      gcalUpdateIndicator();
    }catch(e){ console.warn('gapi.client.init falhou',e); gcalState.gapiInitStarted=false; gcalState.loadFailed=true; gcalState.loadFailedReason='gapi.client.init falhou: '+(e?.message||e?.error||JSON.stringify(e)); if(state.ui.view==='settings') render(); }
  });
};
window.gsiLoaded=()=>{
  if(typeof google==='undefined' || gcalState.tokenClient) return;
  gcalState.tokenClient=google.accounts.oauth2.initTokenClient({ client_id:GCAL_CONFIG.clientId, scope:GCAL_CONFIG.scope, callback:(resp)=>{
    if(resp && resp.access_token){ gcalState.accessToken=resp.access_token; gapi.client.setToken(resp); saveProfileField({gcalConnected:true}); toast('📅 Google Calendar conectado!','success'); gcalFetchEvents(); render(); }
    else{ toast('Não foi possível conectar ao Google Calendar','error'); }
  }, error_callback:(err)=>{
    console.error('GCal OAuth error:',err);
    const type=err?.type||'';
    if(type==='popup_failed_to_open') toast('Pop-up bloqueado pelo navegador — permita pop-ups para este site e tente de novo','error');
    else if(type==='popup_closed') toast('Login com Google cancelado','error');
    else toast('Erro de autenticação Google: '+(type||'verifique o console (F12) para detalhes'),'error');
  }});
  gcalState.gsiReady=true;
};
if(location.protocol==='file:'){
  console.warn('Flowly: este arquivo está sendo aberto como file:// — o Google Sign-In e o Google Calendar EXIGEM http/https e um domínio autorizado no Google Cloud Console. Sirva este arquivo por um servidor web (ex: http://localhost) para que a integração funcione.');
}
// Fallback robusto: os scripts do Google carregam de forma assíncrona e podem
// disparar o evento onload ANTES deste módulo terminar de carregar (que
// precisa baixar o SDK do Firebase primeiro). Por isso, fazemos polling até
// que 'gapi' e 'google' existam no window, independente de qual chegou primeiro.
let gcalPollAttempts=0;
const gcalInitPoll=setInterval(()=>{
  gcalPollAttempts++;
  if(typeof gapi!=='undefined' && !gcalState.gapiReady) window.gapiLoaded();
  if(typeof google!=='undefined' && !gcalState.tokenClient) window.gsiLoaded();
  if(gcalState.gapiReady && gcalState.tokenClient) clearInterval(gcalInitPoll);
  else if(gcalPollAttempts>60){
    clearInterval(gcalInitPoll);
    gcalState.loadFailed=true;
    if(typeof gapi==='undefined') gcalState.loadFailedReason='Script apis.google.com/js/api.js não carregou (gapi indefinido)';
    else if(typeof google==='undefined') gcalState.loadFailedReason='Script accounts.google.com/gsi/client não carregou (google indefinido)';
    else if(!gcalState.gapiReady) gcalState.loadFailedReason='gapi carregou mas gapi.client.init falhou (veja console)';
    else gcalState.loadFailedReason='Motivo desconhecido — veja o console (F12)';
    console.error('Flowly: falha ao inicializar Google APIs —', gcalState.loadFailedReason);
    if(state.ui.view==='settings') render();
  }
},300);
async function gcalConnect(){
  if(location.protocol==='file:'){
    toast('Google Calendar não funciona com o arquivo aberto localmente (file://). Hospede em http/https — veja o aviso no console (F12).','error');
    return;
  }
  if(!gcalState.tokenClient || !gcalState.gapiReady){ toast('Conectando ao Google... tente novamente em alguns segundos','error'); return; }
  gcalState.tokenClient.requestAccessToken();
}
function gcalUpdateIndicator(){
  const ind=document.getElementById('gcalIndicator'); if(!ind) return;
  if(state.profile.gcalConnected && gcalState.gapiReady){ ind.style.display='inline-flex'; ind.textContent='📅 Agenda sincronizada'; }
  else ind.style.display='none';
}
function gcalDisconnect(){ saveProfileField({gcalConnected:false}); gcalState.accessToken=null; toast('Google Calendar desconectado'); render(); }
async function gcalFetchEvents(){
  if(!gcalState.gapiReady||!gcalState.accessToken) return;
  try{
    const resp=await gapi.client.calendar.events.list({calendarId:GCAL_CONFIG.calendarId,timeMin:new Date(new Date().setDate(1)).toISOString(),maxResults:100,singleEvents:true,orderBy:'startTime'});
    gcalState.events=resp.result.items||[]; render();
  }catch(e){ console.warn('gcalFetchEvents',e); }
}
async function gcalUpsertEvent(task){
  if(!gcalState.gapiReady||!gcalState.accessToken||!task.dueDate) return;
  const start=task.dueTime?{dateTime:new Date(task.dueDate+'T'+task.dueTime).toISOString()}:{date:task.dueDate};
  const end=task.dueTime?{dateTime:new Date(new Date(task.dueDate+'T'+task.dueTime).getTime()+30*60000).toISOString()}:{date:task.dueDate};
  const event={summary:task.title,description:task.description||'',start,end};
  try{
    let resp;
    if(task.googleEventId) resp=await gapi.client.calendar.events.update({calendarId:GCAL_CONFIG.calendarId,eventId:task.googleEventId,resource:event});
    else{ resp=await gapi.client.calendar.events.insert({calendarId:GCAL_CONFIG.calendarId,resource:event}); await updateDoc(doc(db,'users',state.user.uid,'tasks',task.id),{googleEventId:resp.result.id,gcalSync:true}); toast('📅 Adicionado ao Google Calendar'); }
  }catch(e){ console.warn('gcalUpsertEvent',e); }
}
async function gcalMarkDone(task){
  if(!gcalState.gapiReady||!task.googleEventId) return;
  try{ await gapi.client.calendar.events.patch({calendarId:GCAL_CONFIG.calendarId,eventId:task.googleEventId,resource:{summary:'✅ '+task.title}}); }catch(e){}
}
async function gcalDeleteEvent(task){
  if(!gcalState.gapiReady||!task.googleEventId) return;
  try{ await gapi.client.calendar.events.delete({calendarId:GCAL_CONFIG.calendarId,eventId:task.googleEventId}); }catch(e){}
}

/* ============================================================
   24. INIT
   ============================================================ */
lucide.createIcons();
</script>
